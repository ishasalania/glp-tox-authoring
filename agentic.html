        );
      } catch (error) {
        if (error.name !== 'OperationError') throw error;
        status.textContent = 'Incorrect password. Please try again.';
        return false;
      }
      if (storageAvailable) {
        try {
          sessionStorage.setItem(storageKey, encode(rawKey));
        } catch (error) {
          storageAvailable = false;
          console.warn('Browser storage unavailable; access cannot be remembered.', error);
        }
      }
      const presentation = new DOMParser().parseFromString(
        new TextDecoder().decode(plaintext), 'text/html'
      );
      document.documentElement.replaceWith(document.importNode(presentation.documentElement, true));
      const lock = document.createElement('button');
      lock.textContent = 'Lock page';
      lock.style.cssText = 'position:fixed;bottom:16px;right:16px;z-index:10000;padding:10px 16px;border:1px solid #fff;border-radius:20px;background:#254f40;color:white;font:14px system-ui;cursor:pointer;width:auto';
      lock.addEventListener('click', () => {
        if (storageAvailable) sessionStorage.removeItem(storageKey);
        location.reload();
      });
      document.body.append(lock);
      if (!storageAvailable) {
        alert('Browser storage is unavailable. You will need to enter the password again when opening another page.');
      }
      if (location.hash) document.getElementById(decodeURIComponent(location.hash.slice(1)))?.scrollIntoView();
      return true;
    }

    document.querySelector('form').addEventListener('submit', async event => {
      event.preventDefault();
      button.disabled = true;
      status.textContent = 'Unlocking...';
      try {
        const material = await crypto.subtle.importKey(
          'raw', new TextEncoder().encode(document.getElementById('password').value),
          'PBKDF2', false, ['deriveBits']
        );
        const bits = await crypto.subtle.deriveBits({
          name: 'PBKDF2', salt: decode(payload.salt),
          iterations: payload.iterations, hash: 'SHA-256'
        }, material, 256);
        await unlock(new Uint8Array(bits));
      } catch (error) {
        showError(error);
      } finally {
        button.disabled = false;
      }
    });

    async function restoreSession() {
      if (!crypto.subtle) {
        status.textContent = 'Use a modern browser over HTTPS to open this presentation.';
        button.disabled = true;
        return;
      }
      let saved;
      try {
        saved = sessionStorage.getItem(storageKey);
      } catch (error) {
        storageAvailable = false;
        status.textContent = 'Browser storage is unavailable; enter the password on each page.';
        console.warn('Browser storage unavailable', error);
      }
      if (saved) {
        try {
          if (!await unlock(decode(saved))) sessionStorage.removeItem(storageKey);
        } catch (error) {
          showError(error);
        }
      }
    }
    document.addEventListener('DOMContentLoaded', restoreSession, { once: true });
  </script>
</body>
</html>
